# SaltNet pipeline — conda environment (recommended: hdbscan/umap install cleanly via conda)
# Create:  conda env create -f environment.yml
# Activate: conda activate saltnet
name: saltnet
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - pandas>=2.0
  - pyarrow>=14.0
  - numpy>=1.24
  - openpyxl>=3.1
  - requests>=2.31
  - pytorch>=2.0
  - umap-learn>=0.5
  - hdbscan>=0.8
  - scikit-learn>=1.3
  - networkx>=3.0
  - matplotlib>=3.8
  - tqdm>=4.66
  - entrez-direct        # NCBI EDirect (esearch/efetch) — bioconda
  - make
  - pip
  - pip:
      - sentence-transformers>=2.5
      - keybert>=0.8
      - wordcloud>=1.9
      - mcp>=1.0
# NOTE: the Claude Code CLI (LLM stages) is installed separately, not via conda.
